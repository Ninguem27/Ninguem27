name: Generate Profile GIFs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_profile_gifs.py'
      - '.github/workflows/profile-gifs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Generate GIFs
        run: python scripts/generate_profile_gifs.py

      - name: Commit generated GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/forja-rpg-banner.gif assets/d20-rolling.gif
          git diff --cached --quiet || git commit -m "Gera GIFs animados do perfil"
          git push
